services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tripopt
      POSTGRES_PASSWORD: tripopt
      POSTGRES_DB: tripopt
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tripopt']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://tripopt:tripopt@db:5432/tripopt
      SECRET_KEY: change-me-in-production
      CORS_ORIGINS: http://localhost:3000
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./frontend/public/images:/app/frontend/public/images:ro

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
